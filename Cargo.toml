[package]
name = "kcl-lang"
version = "0.12.3"
edition = "2024"
readme = "README.md"
documentation = "kcl-lang.io"
description = "KCL Rust SDK"
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1"
kcl-api = { path = "../kcl-lang/crates/api" }
kcl-evaluator = { path = "../kcl-lang/crates/evaluator" }
kcl-loader = { path = "../kcl-lang/crates/loader" }
kcl-parser = { path = "../kcl-lang/crates/parser" }
kcl-runtime = { path = "../kcl-lang/crates/runtime" }
kcl-primitives = { path = "../kcl-lang/crates/primitives" }
